<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Performance Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="description" content="Performance marketing workspace for Meta Ads accounts (demo data).">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}
/* Layout: fixed sidebar + sticky header + scrolling work area; spreadsheet-density tables, hairline borders, one restrained blue accent. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --hover:#eef1f6;
  --line:#e2e5eb; --line-2:#ccd1d9;
  --fg:#151922; --fg-2:#485162; --fg-3:#7a8394;
  --accent:#2457a6; --accent-soft:#e7edf8; --accent-fg:#ffffff;
  --good:#1d7a4b; --good-soft:#e5f2eb; --warn:#9a5f00; --warn-soft:#fbf0dc; --bad:#b3322a; --bad-soft:#f8e8e6; --info:#4b5ba3; --info-soft:#ebedf8;
  --s1:#2457a6; --s2:#8c95a5; --s3:#21877a; --s4:#b9742a;
  --font:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:4px; --row:30px; --fs:13px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --surface:#151920; --surface-2:#1b2029; --hover:#1f2530;
  --line:#252b35; --line-2:#333a46; --fg:#e5e8ed; --fg-2:#a8afbb; --fg-3:#78808f;
  --accent:#7ea4e4; --accent-soft:#1b2940; --accent-fg:#0e1116;
  --good:#4fc28b; --good-soft:#132a1f; --warn:#e2a64a; --warn-soft:#2d2413; --bad:#f07a70; --bad-soft:#331b19; --info:#9aa8ec; --info-soft:#1d2238;
  --s1:#7ea4e4; --s2:#6f7889; --s3:#4cbfaf; --s4:#e0a25a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#151920; --surface-2:#1b2029; --hover:#1f2530;
  --line:#252b35; --line-2:#333a46; --fg:#e5e8ed; --fg-2:#a8afbb; --fg-3:#78808f;
  --accent:#7ea4e4; --accent-soft:#1b2940; --accent-fg:#0e1116;
  --good:#4fc28b; --good-soft:#132a1f; --warn:#e2a64a; --warn-soft:#2d2413; --bad:#f07a70; --bad-soft:#331b19; --info:#9aa8ec; --info-soft:#1d2238;
  --s1:#7ea4e4; --s2:#6f7889; --s3:#4cbfaf; --s4:#e0a25a; color-scheme:dark}
:root[data-density="comfortable"]{--row:36px; --fs:13.5px}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs);line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num,td.n,th.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:var(--mono);font-size:.92em}
#root{height:100%}
.boot{height:100%;display:grid;place-items:center;color:var(--fg-3);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

/* shell */
.shell{display:grid;grid-template-columns:var(--sbw,220px) minmax(0,1fr);height:100%}
.shell.collapsed{--sbw:56px}
.sb{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto;padding-left:env(safe-area-inset-left,0px)}
.sb-head{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);flex:none}
.logo{width:24px;height:24px;border-radius:4px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:600 11px var(--mono);flex:none}
.sb-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sec{padding:12px 8px 4px}
.sb-sec h6{margin:0 0 4px 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:500;white-space:nowrap}
.nav{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:5px 8px;border-radius:var(--r);color:var(--fg-2);cursor:pointer;white-space:nowrap;position:relative}
.nav:hover{background:var(--hover);color:var(--fg)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav .ab{font:500 10.5px var(--mono);width:22px;flex:none;color:inherit;opacity:.8}
.nav .badge{margin-left:auto;font:500 10.5px var(--mono);color:var(--fg-3)}
.collapsed .sb .lbl,.collapsed .sb h6,.collapsed .sb .badge,.collapsed .sb-name,.collapsed .sb-foot .lbl{display:none}
.collapsed .sb-sec h6+*{margin-top:0}
.collapsed .sb-sec{padding:8px 6px 2px;border-top:1px solid var(--line)}
.collapsed .sb-sec:first-of-type{border-top:0}
.sb-foot{margin-top:auto;padding:8px;border-top:1px solid var(--line)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.hdr{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hdr .grow{flex:1}
#h-acct{min-width:112px}
.work{flex:1;overflow:auto;min-height:0}
.page{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.ph .q{color:var(--fg-3);font-size:12.5px;margin-top:2px}
.ph .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.crumbs{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--fg-3);flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer}
.crumbs span.sep{color:var(--line-2)}
.demo-tag{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);padding:1px 6px;border-radius:3px;white-space:nowrap}
.fresh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.menu-btn{display:none}

/* controls */
.btn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);cursor:pointer;white-space:nowrap;font-size:12.5px}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sel,.inp{height:28px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:0 8px;font-size:12.5px;min-width:0}
.inp.num{text-align:right}
textarea.inp{height:auto;padding:6px 8px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;height:26px;padding:0 10px;cursor:pointer;color:var(--fg-2);font-size:12.5px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.chk input{accent-color:var(--accent);margin:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lab{font-size:11.5px;color:var(--fg-2);font-weight:500}
.field .hint{font-size:11.5px;color:var(--fg-3)}
.field .err{font-size:11.5px;color:var(--bad)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.muted{color:var(--fg-3)} .sm{font-size:12px}
input[type=range]{accent-color:var(--accent);width:100%}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.hd{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:40px;flex-wrap:wrap}
.panel>.hd h3{margin:0;font-size:13px;font-weight:600}
.panel>.hd .sub{color:var(--fg-3);font-size:12px}
.panel>.hd .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.panel>.bd{padding:12px}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.note{font-size:12px;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--fg)}
.note.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 25%,transparent);color:var(--fg)}
.note.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 25%,transparent);color:var(--fg)}
.note b{font-weight:600}

/* KPI strip: one bordered band, cells divided by hairlines */
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.kpi{padding:10px 12px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:18px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.kpi .m{display:flex;gap:6px;align-items:baseline;font-size:11.5px;color:var(--fg-3);margin-top:2px;flex-wrap:wrap}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi.click{cursor:pointer}.kpi.click:hover{background:var(--hover)}
.kpi.sel{box-shadow:inset 0 -2px 0 var(--accent)}
.d-up{color:var(--good)}.d-down{color:var(--bad)}.d-flat{color:var(--fg-3)}
.bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.good{background:var(--good)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:3px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.plain::before{display:none}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}.p-acc{background:var(--accent-soft);color:var(--accent)}.p-mute{background:var(--surface-2);color:var(--fg-2);border-color:var(--line)}
.ev{display:inline-flex;gap:2px;vertical-align:middle}.ev i{width:5px;height:11px;border-radius:1px;background:var(--line-2)}.ev i.on{background:var(--fg-2)}

/* tables */
.tw{overflow:auto;max-height:var(--tmax,560px);border-top:1px solid var(--line)}
.panel>.tw:first-child{border-top:0}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.t th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--fg-2);font-weight:500;text-align:left;padding:0 10px;height:30px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.t th.n,.t td.n{text-align:right}
.t th.sort{cursor:pointer}.t th.sort:hover{color:var(--fg)}
.t th .ar{font-size:9px;margin-left:3px;color:var(--accent)}
.t td{padding:0 10px;height:var(--row);border-bottom:1px solid var(--line);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.t tbody tr:hover td{background:var(--hover)}
.t tbody tr.clk{cursor:pointer}
.t tbody tr.selrow td{background:var(--accent-soft)}
.t td.first,.t th.first{position:sticky;left:0;z-index:1;background:var(--surface)}
.t th.first{z-index:3;background:var(--surface-2)}
.t tbody tr:hover td.first{background:var(--hover)}
.t td.cb,.t th.cb{width:32px;padding:0 0 0 10px}
.t td.cb input,.t th.cb input{accent-color:var(--accent);margin:0}
.t tfoot td{font-weight:600;background:var(--surface-2);position:sticky;bottom:0}
.t .name{font-weight:500;color:var(--fg)}
.t .link{color:var(--accent);cursor:pointer;border:0;background:none;padding:0;font:inherit;font-weight:500;text-align:left;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .link:hover{text-decoration:underline}
.t .sub{color:var(--fg-3);font-size:11.5px}
.tbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px}
.tbar .inp{width:200px}
.tfoot{display:flex;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--fg-3);flex-wrap:wrap}
.tfoot .r{margin-left:auto;display:flex;gap:4px;align-items:center}
.empty{padding:28px 12px;text-align:center;color:var(--fg-3);font-size:12.5px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 10px 9px;cursor:pointer;color:var(--fg-2);border-bottom:2px solid transparent;white-space:nowrap;font-size:12.5px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
.tabs button .c{font:11px var(--mono);color:var(--fg-3);margin-left:4px}
.dd{position:relative;display:inline-block}
.dd-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:40;min-width:180px;padding:4px;max-height:340px;overflow:auto}
.dd-menu .it{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;font-size:12.5px;width:100%;border:0;background:none;text-align:left}
.dd-menu .it:hover{background:var(--hover)}
.dd-menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:6px 8px;font-size:11.5px;box-shadow:0 4px 14px rgba(0,0,0,.1);white-space:nowrap;z-index:5}
.chart .tip .k{display:flex;gap:8px;justify-content:space-between}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--fg-2)}
.legend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:5px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--s2) 0 4px,transparent 4px 7px)!important}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.36);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--surface);border-left:1px solid var(--line-2);z-index:51;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.wide{width:min(860px,100vw)}
.drawer>.hd,.modal>.hd{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.drawer>.hd h2,.modal>.hd h2{margin:0;font-size:15px;font-weight:600;text-wrap:balance}
.drawer>.hd .sub,.modal>.hd .sub{color:var(--fg-3);font-size:12px;margin-top:2px}
.drawer>.bd{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;min-height:0}
.drawer>.ft,.modal>.ft{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--fg-3);font-size:18px;line-height:1;padding:2px 4px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;z-index:61;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{width:min(440px,calc(100vw - 24px))}
.modal>.bd{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.scrim.m{z-index:60}
.sec h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:12.5px}
.kv dt{color:var(--fg-3)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
ul.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.steps{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.steps div{flex:1;padding:6px 8px;font-size:11.5px;color:var(--fg-3);border-left:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps div:first-child{border-left:0}
.steps div.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.steps div.done{color:var(--fg-2)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-size:12.5px;z-index:80;max-width:calc(100vw - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* alerts */
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:4px 1fr;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.alert:hover{background:var(--hover)}
.alert:last-child{border-bottom:0}
.alert .sv{border-radius:2px;background:var(--line-2)}
.alert .sv.bad{background:var(--bad)}.alert .sv.warn{background:var(--warn)}.alert .sv.info{background:var(--info)}
.alert .tt{font-weight:500;font-size:12.5px}
.alert .dd2{font-size:12px;color:var(--fg-2);margin-top:1px}

/* creatives */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:12px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
.card:hover{border-color:var(--line-2)}
.card.picked{outline:2px solid var(--accent);outline-offset:-1px}
.prev{aspect-ratio:4/5;max-width:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff}
.prev.lg{aspect-ratio:4/5;max-height:420px}
.prev .fmt{position:absolute;top:8px;left:8px;font:500 10px var(--mono);letter-spacing:.06em;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:2px}
.prev .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.85)}
.prev .play::after{content:"";position:absolute;left:14px;top:10px;border-left:12px solid rgba(255,255,255,.9);border-top:7px solid transparent;border-bottom:7px solid transparent}
.prev .hl{font-weight:600;font-size:15px;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.prev .cta{margin-top:8px;align-self:flex-start;font-size:11px;background:rgba(255,255,255,.92);color:#111;padding:3px 8px;border-radius:2px;font-weight:500}
.prev .dl{position:absolute;top:8px;right:8px;font:500 9.5px var(--mono);background:rgba(0,0,0,.45);padding:2px 6px;border-radius:2px}
.card .meta{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.card .nm{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mx{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;font-size:11.5px}
.card .mx span{color:var(--fg-3);display:block;font-size:10.5px}
.card .mx b{font-weight:500;font-variant-numeric:tabular-nums}
.cmp-grid{display:grid;gap:12px}

/* funnel */
.fun{display:flex;flex-direction:column;gap:6px}
.fs{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r);border:1px solid transparent;cursor:pointer;background:none;text-align:left;width:100%}
.fs:hover{background:var(--hover)}
.fs.on{border-color:var(--accent);background:var(--accent-soft)}
.fs .fb{height:22px;background:var(--surface-2);border-radius:2px;position:relative;overflow:hidden}
.fs .fb i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 70%,transparent);border-radius:2px}
.fs .fb i.flag{background:color-mix(in srgb,var(--bad) 70%,transparent)}
.fs .fb i.wflag{background:color-mix(in srgb,var(--warn) 75%,transparent)}
.fs .fv{font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
.fconv{display:flex;gap:10px;font-size:11.5px;color:var(--fg-3);padding:0 8px 0 168px;flex-wrap:wrap}

/* timeline */
.tl{display:flex;flex-direction:column}
.tle{display:grid;grid-template-columns:120px 14px minmax(0,1fr);gap:10px;padding:0 12px;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.tle:hover .tlc{background:var(--hover)}
.tle .when{padding-top:12px;font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.tle .rail{position:relative}
.tle .rail::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:1px;background:var(--line-2)}
.tle .rail i{position:absolute;left:2px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--fg-3)}
.tle .rail i.good{border-color:var(--good)}.tle .rail i.bad{border-color:var(--bad)}.tle .rail i.warn{border-color:var(--warn)}.tle .rail i.info{border-color:var(--info)}
.tlc{padding:10px;margin:4px 0;border-radius:var(--r);display:flex;flex-direction:column;gap:4px;min-width:0}
.tlc .tt{font-weight:500}
.tlc .ln{font-size:12px;color:var(--fg-2)}
.drop{border:1.5px dashed var(--line-2);border-radius:6px;padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.chg-up{color:var(--good)}.chg-dn{color:var(--bad)}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 32px;display:flex;flex-direction:column;gap:18px;max-width:880px;width:100%}
.report h2{margin:0;font-size:20px;font-weight:600}
.report h3{margin:0 0 6px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--hover),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:3px;height:14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* responsive */
@media (max-width:1280px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi:nth-child(4n+1){border-left:0}.kpis:not(.k5):not(.k6):not(.k4) .kpi:nth-child(n+5){border-top:1px solid var(--line)}}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.k5,.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k5 .kpi,.kpis.k6 .kpi{border-top:1px solid var(--line);border-left:1px solid var(--line)}.kpis.k5 .kpi:nth-child(-n+3),.kpis.k6 .kpi:nth-child(-n+3){border-top:0}.kpis.k5 .kpi:nth-child(3n+1),.kpis.k6 .kpi:nth-child(3n+1){border-left:0}}
@media (max-width:900px){
  .shell,.shell.collapsed{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;inset:0 auto 0 0;width:260px;z-index:55;transform:translateX(-100%);transition:transform .18s;padding-top:env(safe-area-inset-top,0px)}
  .shell.mob-open .sb{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.2)}
  .collapsed .sb .lbl,.collapsed .sb h6,.collapsed .sb .badge,.collapsed .sb-name{display:revert}
  .menu-btn{display:inline-flex}.col-btn{display:none}
  .hdr .hide-m{display:none}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .fs{grid-template-columns:110px minmax(0,1fr) 80px}.fconv{padding-left:8px}
  .tle{grid-template-columns:80px 14px minmax(0,1fr)}
  .report{padding:18px}
}
@media (max-width:560px){.kpis,.kpis.k5,.kpis.k6,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi{border-left:1px solid var(--line)!important;border-top:1px solid var(--line)!important}.kpis .kpi:nth-child(odd){border-left:0!important}.kpis .kpi:nth-child(-n+2){border-top:0!important}.g4{grid-template-columns:minmax(0,1fr)}.tbar .inp{width:100%}.hdr .hide-s{display:none}}
@media print{.sb,.hdr,.no-print{display:none!important}.shell{display:block}.work{overflow:visible}.report{border:0;max-width:none}}
</style>
</head>

<script src="core.js" charset="utf-8"></script>
<script src="screens.js" charset="utf-8"></script>
<script src="app.js" charset="utf-8"></script>
